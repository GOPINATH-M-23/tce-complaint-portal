# ─────────────────────────────────────────────────────────────────────────────
#  TCE Smart Complaint Portal — Netlify Configuration
#  Production-grade: CSP headers, security headers, SPA routing, functions
# ─────────────────────────────────────────────────────────────────────────────

[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ── Dev server (local netlify dev) ────────────────────────────────────────────
[dev]
  command     = "npm run dev"
  port        = 5173
  targetPort  = 5173
  framework   = "vite"

# ── Netlify Functions ─────────────────────────────────────────────────────────
[functions]
  node_bundler = "esbuild"
  # Each function gets 10s timeout (Netlify free: 10s, Pro: 26s)
  included_files = ["netlify/functions/_middleware/**", "netlify/functions/_utils/**", "netlify/functions/_validators/**"]

# ── SPA routing — all routes serve index.html ─────────────────────────────────
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security & performance headers ────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevents clickjacking
    X-Frame-Options = "DENY"

    # XSS protection (legacy browsers)
    X-XSS-Protection = "1; mode=block"

    # Prevents MIME sniffing
    X-Content-Type-Options = "nosniff"

    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Permissions policy — restrict unnecessary browser APIs
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

    # HSTS — force HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Content Security Policy
    # - default-src: only self
    # - script-src: self + unsafe-inline for Vite HMR, unpkg for CDN fonts
    # - style-src: self + unsafe-inline for Tailwind + Google Fonts
    # - img-src: self, data URIs, Cloudinary, Firebase Storage
    # - connect-src: self, Firebase APIs, Cloudinary, Google APIs
    # - font-src: self + Google Fonts
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://apis.google.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      img-src 'self' data: blob: https://res.cloudinary.com https://lh3.googleusercontent.com https://firebasestorage.googleapis.com;
      connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://api.cloudinary.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com wss://*.firebaseio.com;
      font-src 'self' https://fonts.gstatic.com;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
    """

# Static assets — long cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — no cache (always fresh)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# API functions — no cache
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-cache, no-store"
    Access-Control-Allow-Origin  = "https://tce-complaint-portal.netlify.app"
    Access-Control-Allow-Methods = "GET, POST, PUT, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
